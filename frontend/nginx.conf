server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optionally you can proxy API calls to backend if you prefer same-origin
    # location /api/ {
    #     proxy_pass http://backend:8000/;
    # }
}
